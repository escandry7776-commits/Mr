<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReportBot v2 - گزارش‌ساز تلگرام</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1a1f35 100%);
            color: #e7edf9;
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            padding: 20px;
            direction: rtl;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            padding: 40px 20px;
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }
        
        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #38bdf8, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .header p {
            color: #94a3b8;
            font-size: 14px;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        
        .card:hover {
            border-color: rgba(148, 163, 184, 0.5);
            background: rgba(30, 41, 59, 0.95);
            transform: translateY(-5px);
        }
        
        .card h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .card-content {
            margin-bottom: 15px;
        }
        
        .report-item {
            background: rgba(15, 23, 42, 0.8);
            border-right: 4px solid #38bdf8;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 13px;
            line-height: 1.6;
        }
        
        .report-id {
            color: #06b6d4;
            font-weight: bold;
            margin-bottom: 4px;
        }
        
        .report-subject {
            color: #cbd5e1;
            margin-bottom: 4px;
            word-break: break-word;
        }
        
        .report-meta {
            color: #64748b;
            font-size: 12px;
        }
        
        .input-group {
            margin-bottom: 15px;
        }
        
        input, textarea {
            width: 100%;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.3);
            border-radius: 8px;
            padding: 10px 12px;
            color: #e7edf9;
            font-family: inherit;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: #38bdf8;
            background: rgba(15, 23, 42, 0.95);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.1);
        }
        
        textarea {
            resize: vertical;
            min-height: 100px;
            font-size: 13px;
        }
        
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            width: 100%;
            margin-bottom: 8px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.2);
        }
        
        .btn-green {
            background: linear-gradient(135deg, #059669, #047857);
        }
        
        .btn-green:hover {
            box-shadow: 0 10px 20px rgba(5, 150, 105, 0.2);
        }
        
        .btn-red {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
        }
        
        .btn-red:hover {
            box-shadow: 0 10px 20px rgba(220, 38, 38, 0.2);
        }
        
        .btn-orange {
            background: linear-gradient(135deg, #d97706, #b45309);
        }
        
        .btn-orange:hover {
            box-shadow: 0 10px 20px rgba(217, 119, 6, 0.2);
        }
        
        .status {
            padding: 12px 16px;
            border-radius: 8px;
            margin: 10px 0;
            font-size: 13px;
            display: none;
        }
        
        .status.success {
            display: block;
            background: rgba(5, 150, 105, 0.2);
            border: 1px solid rgba(5, 150, 105, 0.5);
            color: #34d399;
        }
        
        .status.error {
            display: block;
            background: rgba(220, 38, 38, 0.2);
            border: 1px solid rgba(220, 38, 38, 0.5);
            color: #fca5a5;
        }
        
        .status.info {
            display: block;
            background: rgba(56, 189, 248, 0.2);
            border: 1px solid rgba(56, 189, 248, 0.5);
            color: #38bdf8;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        .stat-box {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 24px;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 12px;
            color: #94a3b8;
        }
        
        .preview-section {
            background: rgba(15, 23, 42, 0.8);
            border-radius: 8px;
            padding: 15px;
            margin-top: 10px;
            max-height: 200px;
            overflow-y: auto;
        }
        
        .preview-section h4 {
            color: #38bdf8;
            font-size: 12px;
            margin-bottom: 8px;
        }
        
        .preview-text {
            color: #cbd5e1;
            font-size: 12px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }
        
        .empty-state {
            text-align: center;
            padding: 30px;
            color: #64748b;
        }
        
        .empty-state-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.2);
        }
        
        .tab-btn {
            padding: 10px 16px;
            background: transparent;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-weight: 600;
            border-bottom: 2px solid transparent;
            transition: all 0.3s ease;
            font-size: 14px;
        }
        
        .tab-btn.active {
            color: #38bdf8;
            border-bottom-color: #38bdf8;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }
            
            .grid {
                grid-template-columns: 1fr;
            }
            
            .tabs {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📧 ReportBot v2</h1>
        <p>گزارش‌ساز خودکار برای تلگرام - HTML Version</p>
    </div>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="showTab('reports')">📋 گزارش‌ها</button>
        <button class="tab-btn" onclick="showTab('add')">➕ افزودن</button>
        <button class="tab-btn" onclick="showTab('sender')">✉️ فرستادن</button>
    </div>
    
    <!-- TAB: Reports -->
    <div id="reports" class="tab-content active">
        <div class="grid">
            <div class="card">
                <h2>📊 آمار کل</h2>
                <div class="stats">
                    <div class="stat-box">
                        <div class="stat-number" id="totalCount">0</div>
                        <div class="stat-label">تعداد گزارش‌ها</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-number" id="totalChars">0</div>
                        <div class="stat-label">کل کاراکتر</div>
                    </div>
                </div>
            </div>
            
            <div class="card">
                <h2>📋 لیست گزارش‌ها</h2>
                <div id="reportsList" class="card-content">
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <div>هیچ گزارشی ثبت نشده است</div>
                    </div>
                </div>
                <button class="btn btn-red" onclick="clearAllReports()">🗑 حذف همه</button>
            </div>
        </div>
    </div>
    
    <!-- TAB: Add Report -->
    <div id="add" class="tab-content">
        <div class="card">
            <h2>➕ افزودن گزارش جدید</h2>
            
            <div class="input-group">
                <input type="text" id="newSubject" placeholder="سابجکت ایمیل (مثال: URGENT: Report)" maxlength="200">
            </div>
            
            <div class="input-group">
                <textarea id="newBody" placeholder="متن گزارش (انگلیسی، با لینک‌ها و جزئیات)"></textarea>
            </div>
            
            <button class="btn btn-green" onclick="addNewReport()">✅ اضافه کردن</button>
            <div id="addStatus" class="status"></div>
            
            <div id="previewContainer" class="preview-section" style="display:none;">
                <h4>👁️ پیش‌نمایش:</h4>
                <div class="preview-text" id="previewText"></div>
            </div>
        </div>
    </div>
    
    <!-- TAB: Sender -->
    <div id="sender" class="tab-content">
        <div class="card">
            <h2>✉️ فرستادن گزارش</h2>
            
            <div id="senderContainer">
                <div id="selectedReport" class="report-item" style="display:none;">
                    <div class="report-id" id="reportSendId"></div>
                    <div class="report-subject" id="reportSendSubject"></div>
                    <div class="preview-text" id="reportSendBody"></div>
                </div>
                
                <button class="btn btn-orange" onclick="pickRandomReport()" style="margin-top:15px;">🔄 انتخاب گزارش رندوم</button>
                
                <div id="senderStatus" class="status"></div>
                
                <div style="margin-top: 15px;">
                    <label>
                        📧 ایمیل گیرنده:
                        <input type="text" id="emailTo" value="abuse@telegram.org,reports@telegram.org,stopCA@telegram.org,dmca@telegram.org" readonly style="margin-top:5px; background: rgba(15, 23, 42, 0.6); opacity: 0.7;">
                    </label>
                </div>
                
                <button class="btn btn-green" onclick="sendEmailClient()" style="margin-top:15px;">🚀 فرستادن به ایمیل</button>
                <button class="btn" onclick="copyEmailData()" style="margin-top:5px;">📋 کپی کردن داده‌ها</button>
            </div>
        </div>
    </div>
</div>

<script>
(function() {
    const STORAGE_KEY = 'reportbot_reports';
    const TO = "abuse@telegram.org,reports@telegram.org,stopCA@telegram.org,dmca@telegram.org";
    let reports = [];
    let selectedReportId = null;
    
    // ═══════════════════════════════════════════════════════════
    // Storage Functions
    // ═══════════════════════════════════════════════════════════
    function loadReports() {
        const stored = localStorage.getItem(STORAGE_KEY);
        reports = stored ? JSON.parse(stored) : [];
        updateUI();
    }
    
    function saveReports() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(reports));
        updateUI();
    }
    
    // ═══════════════════════════════════════════════════════════
    // UI Functions
    // ═══════════════════════════════════════════════════════════
    function showTab(tabName) {
        // Hide all tabs
        document.querySelectorAll('.tab-content').forEach(tab => {
            tab.classList.remove('active');
        });
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.remove('active');
        });
        
        // Show selected tab
        document.getElementById(tabName).classList.add('active');
        event.target.classList.add('active');
    }
    
    function updateUI() {
        updateStats();
        updateReportsList();
    }
    
    function updateStats() {
        const count = reports.length;
        const chars = reports.reduce((sum, r) => sum + (r.body?.length || 0), 0);
        
        document.getElementById('totalCount').textContent = count;
        document.getElementById('totalChars').textContent = chars.toLocaleString('fa-IR');
    }
    
    function updateReportsList() {
        const list = document.getElementById('reportsList');
        
        if (reports.length === 0) {
            list.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">📭</div>
                    <div>هیچ گزارشی ثبت نشده است</div>
                </div>
            `;
            return;
        }
        
        list.innerHTML = reports.map(r => `
            <div class="report-item">
                <div class="report-id">گزارش #${r.id}</div>
                <div class="report-subject">📌 ${r.subject}</div>
                <div class="report-meta">
                    📝 ${r.body.length} کاراکتر | ⏰ ${new Date(r.created).toLocaleDateString('fa-IR')}
                </div>
                <button class="btn" onclick="deleteReport(${r.id})" style="margin-top:8px; background: linear-gradient(135deg, #dc2626, #b91c1c); padding: 6px 12px; font-size: 12px;">
                    ❌ حذف
                </button>
            </div>
        `).join('');
    }
    
    // ═══════════════════════════════════════════════════════════
    // Report Functions
    // ═══════════════════════════════════════════════════════════
    function addNewReport() {
        const subject = document.getElementById('newSubject').value.trim();
        const body = document.getElementById('newBody').value.trim();
        
        if (!subject || !body) {
            showStatus('addStatus', 'لطفاً سابجکت و متن را پر کنید', 'error');
            return;
        }
        
        const report = {
            id: reports.length + 1,
            subject: subject,
            body: body,
            created: new Date().toISOString()
        };
        
        reports.push(report);
        saveReports();
        
        document.getElementById('newSubject').value = '';
        document.getElementById('newBody').value = '';
        document.getElementById('previewContainer').style.display = 'none';
        
        showStatus('addStatus', `✅ گزارش #${report.id} اضافه شد!`, 'success');
        setTimeout(() => {
            document.getElementById('addStatus').style.display = 'none';
        }, 3000);
    }
    
    function deleteReport(id) {
        if (confirm('آیا مطمئن هستید؟')) {
            reports = reports.filter(r => r.id !== id);
            saveReports();
        }
    }
    
    function clearAllReports() {
        if (confirm('تمام گزارش‌ها حذف شوند؟')) {
            reports = [];
            saveReports();
        }
    }
    
    function pickRandomReport() {
        if (reports.length === 0) {
            showStatus('senderStatus', '⚠️ هیچ گزارشی ثبت نشده است', 'error');
            return;
        }
        
        const idx = Math.floor(Math.random() * reports.length);
        const report = reports[idx];
        selectedReportId = report.id;
        
        document.getElementById('selectedReport').style.display = 'block';
        document.getElementById('reportSendId').textContent = `📌 گزارش #${report.id}`;
        document.getElementById('reportSendSubject').textContent = report.subject;
        document.getElementById('reportSendBody').textContent = report.body;
        
        showStatus('senderStatus', `✅ گزارش #${report.id} انتخاب شد!`, 'success');
    }
    
    function sendEmailClient() {
        if (!selectedReportId) {
            showStatus('senderStatus', '⚠️ ابتدا گزارش‌ی انتخاب کنید', 'error');
            return;
        }
        
        const report = reports.find(r => r.id === selectedReportId);
        if (!report) return;
        
        const subject = encodeURIComponent(report.subject);
        const body = encodeURIComponent(report.body.substring(0, 1800));
        const mailto = `mailto:${TO}?subject=${subject}&body=${body}`;
        
        window.location.href = mailto;
        showStatus('senderStatus', '🚀 درحال باز کردن ایمیل...', 'info');
    }
    
    function copyEmailData() {
        if (!selectedReportId) {
            showStatus('senderStatus', '⚠️ ابتدا گزارش‌ی انتخاب کنید', 'error');
            return;
        }
        
        const report = reports.find(r => r.id === selectedReportId);
        if (!report) return;
        
        const data = `Subject: ${report.subject}\n\n${report.body}\n\nTo: ${TO}`;
        navigator.clipboard.writeText(data).then(() => {
            showStatus('senderStatus', '✅ داده‌ها کپی شدند!', 'success');
            setTimeout(() => {
                document.getElementById('senderStatus').style.display = 'none';
            }, 2000);
        });
    }
    
    function showStatus(elementId, message, type) {
        const el = document.getElementById(elementId);
        el.textContent = message;
        el.className = `status ${type}`;
    }
    
    // ═══════════════════════════════════════════════════════════
    // Event Listeners
    // ═══════════════════════════════════════════════════════════
    document.getElementById('newBody').addEventListener('input', function() {
        const subject = document.getElementById('newSubject').value.trim();
        const body = this.value.trim();
        
        if (subject && body) {
            document.getElementById('previewContainer').style.display = 'block';
            document.getElementById('previewText').textContent = body.substring(0, 200) + (body.length > 200 ? '...' : '');
        } else {
            document.getElementById('previewContainer').style.display = 'none';
        }
    });
    
    // ═══════════════════════════════════════════════════════════
    // Init
    // ═══════════════════════════════════════════════════════════
    loadReports();
    
    // Expose functions to global scope
    window.showTab = showTab;
    window.addNewReport = addNewReport;
    window.deleteReport = deleteReport;
    window.clearAllReports = clearAllReports;
    window.pickRandomReport = pickRandomReport;
    window.sendEmailClient = sendEmailClient;
    window.copyEmailData = copyEmailData;
})();
</script>
</body>
</html>
