<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گزارش‌ساز خودکار تلگرام</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{
            background:#0a0e17;color:#e7edf9;
            font-family:'Segoe UI',system-ui,sans-serif;
            display:flex;justify-content:center;align-items:center;
            min-height:100vh;padding:20px;direction:rtl;text-align:center
        }
        .container{
            max-width:620px;width:100%;background:#111827;
            padding:36px 26px;border-radius:28px;
            border:1px solid #1e293b;
            box-shadow:0 20px 40px -12px rgba(0,0,0,.8)
        }
        h1{font-size:22px;color:#f1f5f9;margin-bottom:10px}
        h1 small{
            font-size:13px;font-weight:400;color:#94a3b8;
            background:#1e293b;padding:4px 14px;border-radius:40px
        }
        .btn{
            display:inline-block;margin-top:14px;padding:15px 32px;
            background:#2563eb;color:#fff;border-radius:40px;
            text-decoration:none;font-weight:600;border:none;
            cursor:pointer;font-size:17px;transition:.25s;width:100%
        }
        .btn:hover{background:#1d4ed8;transform:translateY(-2px)}
        .btn-green{background:#059669}
        .btn-green:hover{background:#047857}
        .btn-orange{background:#d97706}
        .btn-orange:hover{background:#b45309}
        .info{
            margin-top:18px;padding:14px 18px;background:#1e293b;
            border-radius:12px;font-size:12px;color:#94a3b8;
            text-align:right;line-height:1.8
        }
        .info strong{color:#e2e8f0}
        .badge{
            display:inline-block;background:#1d4ed8;padding:5px 18px;
            border-radius:40px;font-size:13px;color:#fff;margin:12px 0
        }
        .subject-box{
            margin-top:12px;padding:12px 16px;background:#0f172a;
            border-radius:10px;font-size:13px;color:#38bdf8;
            text-align:left;direction:ltr;border:1px solid #1e3a5f;
            word-break:break-word
        }
        .preview{
            margin-top:12px;padding:14px 18px;background:#0f172a;
            border-radius:12px;font-size:12px;color:#cbd5e1;
            text-align:left;direction:ltr;max-height:200px;
            overflow-y:auto;line-height:1.7;white-space:pre-wrap;
            border:1px solid #1e293b;word-break:break-word
        }
        .status{margin-top:10px;padding:10px;border-radius:8px;font-size:13px;display:none}
        .status.ok{display:block;background:#064e3b;color:#34d399}
        .status.err{display:block;background:#7f1d1d;color:#fca5a5}
        .counter{font-size:11px;color:#64748b;margin-top:8px}
        .warning{
            margin-top:14px;padding:14px 18px;background:#1e293b;
            border-radius:12px;font-size:13px;color:#fcd34d;
            border-right:4px solid #f59e0b;text-align:right;line-height:1.8
        }
        .loading{
            margin-top:20px;padding:20px;color:#64748b;font-size:14px
        }
        .spinner{
            display:inline-block;width:20px;height:20px;
            border:3px solid #1e293b;border-top:3px solid #38bdf8;
            border-radius:50%;animation:spin 1s linear infinite;
            margin-left:8px;vertical-align:middle
        }
        @keyframes spin{to{transform:rotate(360deg)}}
    </style>
</head>
<body>
<div class="container">
    <h1>📧 گزارش‌ساز خودکار <small>Telegram Report</small></h1>
    <div class="badge" id="deviceBadge">🔍 در حال تشخیص دستگاه ...</div>

    <!-- موضوع -->
    <div class="info">
        <strong>📌 موضوع ایمیل:</strong>
        <div class="subject-box" id="subjectText">
            <span class="loading"><span class="spinner"></span> در حال بارگذاری ...</span>
        </div>
    </div>

    <!-- متن -->
    <div class="info">
        <strong>📝 متن گزارش:</strong>
        <div class="preview" id="previewText">در حال بارگذاری ...</div>
        <div class="counter" id="counterText"></div>
    </div>

    <!-- دکمه‌ها -->
    <button class="btn" id="gmailBtn">✉️ باز کردن Gmail (اپلیکیشن)</button>
    <button class="btn btn-green" id="mailtoBtn" style="margin-top:10px">📧 ایمیل پیش‌فرض دستگاه</button>
    <button class="btn btn-orange" id="refreshBtn" style="margin-top:10px">🔄 گزارش بعدی (رندوم)</button>

    <div class="status" id="statusMsg"></div>

    <div class="warning">
        💡 <strong>راهنما:</strong><br>
        • هر بار <strong>موضوع + متن</strong> متفاوت انتخاب می‌شود<br>
        • Gmail <strong>اپلیکیشن</strong> باز می‌شود (نه سایت)<br>
        • فقط دکمه <strong>Send</strong> را بزنید<br>
        • دکمه 🔄 برای انتخاب گزارش جدید
    </div>
</div>

<script>
(function(){
    // ═══════════════════════════════════════════════════════
    // متغیرها
    // ═══════════════════════════════════════════════════════
    const TO = "abuse@telegram.org,reports@telegram.org,stopCA@telegram.org,dmca@telegram.org";
    let reports = [];
    let currentIdx = -1;
    let SUBJECT = "";
    let BODY = "";

    // ═══════════════════════════════════════════════════════
    // تشخیص دستگاه
    // ═══════════════════════════════════════════════════════
    const ua = navigator.userAgent || navigator.vendor || window.opera;
    const isAndroid = /android/i.test(ua);
    const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
    const badge = document.getElementById('deviceBadge');

    if (isAndroid)      badge.textContent = '🤖 اندروید → Gmail App';
    else if (isIOS)     badge.textContent = '🍎 آیفون → Mail / Gmail App';
    else                badge.textContent = '💻 کامپیوتر → Mail App';

    // ═══════════════════════════════════════════════════════
    // توابع کمکی
    // ═══════════════════════════════════════════════════════
    function enc(s){ return encodeURIComponent(s); }

    function showStatus(msg, ok){
        const el = document.getElementById('statusMsg');
        el.textContent = msg;
        el.className = 'status ' + (ok ? 'ok' : 'err');
    }

    // ═══════════════════════════════════════════════════════
    // بارگذاری گزارش‌ها از API ربات
    // ═══════════════════════════════════════════════════════
    async function loadReports(){
        try {
            const resp = await fetch('/api/reports');
            const data = await resp.json();
            if (!data.reports || data.reports.length === 0){
                document.getElementById('subjectText').textContent = '⚠️ هیچ گزارشی ثبت نشده';
                document.getElementById('previewText').textContent = 'ادمین هنوز گزارشی اضافه نکرده. از ربات تلگرام /add بزنید.';
                document.getElementById('counterText').textContent = '';
                return false;
            }
            reports = data.reports;
            pickRandom();
            return true;
        } catch(e){
            document.getElementById('subjectText').textContent = '❌ خطا در اتصال به سرور';
            document.getElementById('previewText').textContent = 'ربات تلگرام در حال اجرا نیست.';
            return false;
        }
    }

    // ═══════════════════════════════════════════════════════
    // انتخاب رندوم
    // ═══════════════════════════════════════════════════════
    function pickRandom(){
        if (reports.length === 0) return;
        // انتخاب رندوم (متفاوت از قبلی)
        let newIdx;
        do {
            newIdx = Math.floor(Math.random() * reports.length);
        } while (newIdx === currentIdx && reports.length > 1);

        currentIdx = newIdx;
        SUBJECT = reports[currentIdx].subject;
        BODY = reports[currentIdx].body;

        document.getElementById('subjectText').textContent = SUBJECT;
        document.getElementById('previewText').textContent = BODY;
        document.getElementById('counterText').textContent =
            '📌 گزارش ' + (currentIdx + 1) + ' از ' + reports.length +
            ' | ' + BODY.length + ' کاراکتر';
    }

    // ═══════════════════════════════════════════════════════
    // باز کردن Gmail APP (نه سایت)
    // ═══════════════════════════════════════════════════════
    function openGmailApp(){
        if (!SUBJECT || !BODY){
            showStatus('⚠️ گزارشی وجود ندارد', false);
            return;
        }
        showStatus('⏳ در حال باز کردن Gmail ...', true);

        if (isAndroid){
            // اندروید: intent:// مستقیم Gmail App
            const mailto = 'mailto:' + enc(TO)
                + '?subject=' + enc(SUBJECT)
                + '&body=' + enc(BODY.substring(0, 1800));
            const intent = 'intent:' + mailto
                + '#Intent;scheme=mailto;'
                + 'package=com.google.android.gm;'
                + 'action=android.intent.action.SENDTO;'
                + 'S.browser_fallback_url=' + enc(mailto)
                + ';end';
            window.location.href = intent;
        } else if (isIOS){
            // آیفون: mailto → Mail App یا Gmail App
            const mailto = 'mailto:' + enc(TO)
                + '?subject=' + enc(SUBJECT)
                + '&body=' + enc(BODY.substring(0, 1800));
            window.location.href = mailto;
        } else {
            // کامپیوتر: mailto → اپلیکیشن پیش‌فرض
            const mailto = 'mailto:' + enc(TO)
                + '?subject=' + enc(SUBJECT)
                + '&body=' + enc(BODY);
            window.location.href = mailto;
        }
    }

    // ═══════════════════════════════════════════════════════
    // ایمیل پیش‌فرض
    // ═══════════════════════════════════════════════════════
    function openMailto(){
        if (!SUBJECT || !BODY){
            showStatus('⚠️ گزارشی وجود ندارد', false);
            return;
        }
        showStatus('⏳ در حال باز کردن ایمیل ...', true);
        const shortBody = BODY.substring(0, 1800);
        window.location.href = 'mailto:' + enc(TO)
            + '?subject=' + enc(SUBJECT)
            + '&body=' + enc(shortBody);
    }

    // ═══════════════════════════════════════════════════════
    // دکمه‌ها
    // ═══════════════════════════════════════════════════════
    document.getElementById('gmailBtn').addEventListener('click', openGmailApp);
    document.getElementById('mailtoBtn').addEventListener('click', openMailto);
    document.getElementById('refreshBtn').addEventListener('click', function(){
        pickRandom();
        showStatus('🔄 گزارش جدید انتخاب شد', true);
    });

    // ═══════════════════════════════════════════════════════
    // بارگذاری اولیه + هدایت خودکار
    // ═══════════════════════════════════════════════════════
    loadReports().then(function(ok){
        if (ok){
            // هدایت خودکار بعد از ۲.۵ ثانیه
            setTimeout(function(){
                if (SUBJECT && BODY) openGmailApp();
            }, 2500);
        }
    });

})();
</script>
</body>
</html>
